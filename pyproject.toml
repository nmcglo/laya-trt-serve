[project]
name = "laya-trt-serve"
version = "0.1.0"
description = "Serve Laya decision models on TensorRT over the Jev /v1/systemone API"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = [
    "LICENSE",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "huggingface-hub>=1.33",
    "numpy>=2.5",
    "tensorrt>=11.3",
    "tokenizers>=0.23",
    "torch>=2.14",
    "uvicorn>=0.54",
]

[dependency-groups]
build = [
    "laya>=0.3.21",
    "onnx>=1.23",
    "onnxscript>=0.7.2",
]
